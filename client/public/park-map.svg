<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Stylized illustrated map of four theme-park lands connected by winding pathways">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d9a3"/>
      <stop offset="1" stop-color="#fbf6ec"/>
    </linearGradient>
  </defs>
  <rect width="520" height="360" rx="14" fill="url(#sky)"/>

  <!-- winding paths -->
  <path d="M60 300 C140 250 160 180 260 180 C360 180 380 110 460 70"
        fill="none" stroke="#d99a2b" stroke-width="6" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.8"/>
  <path d="M70 90 C160 130 180 200 260 180 C340 160 380 230 450 300"
        fill="none" stroke="#0f5e57" stroke-width="6" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.55"/>

  <!-- central hub -->
  <circle cx="260" cy="180" r="26" fill="#fbf6ec" stroke="#20302f" stroke-width="3"/>
  <circle cx="260" cy="180" r="11" fill="#e8633f"/>

  <!-- land 1: castle (top-left) -->
  <g transform="translate(70,60)">
    <rect x="0" y="22" width="56" height="34" fill="#0f5e57" stroke="#20302f" stroke-width="3"/>
    <polygon points="6,22 18,4 30,22" fill="#e8633f" stroke="#20302f" stroke-width="3"/>
    <polygon points="26,22 38,0 50,22" fill="#e8633f" stroke="#20302f" stroke-width="3"/>
    <rect x="22" y="40" width="12" height="16" fill="#f0d9a3" stroke="#20302f" stroke-width="2"/>
  </g>

  <!-- land 2: ferris wheel (top-right) -->
  <g transform="translate(420,70)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#0f5e57" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#d99a2b" stroke="#20302f" stroke-width="2"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#0f5e57" stroke-width="2"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#0f5e57" stroke-width="2"/>
    <line x1="-21" y1="-21" x2="21" y2="21" stroke="#0f5e57" stroke-width="2"/>
    <line x1="-21" y1="21" x2="21" y2="-21" stroke="#0f5e57" stroke-width="2"/>
    <line x1="0" y1="30" x2="-12" y2="58" stroke="#20302f" stroke-width="3"/>
    <line x1="0" y1="30" x2="12" y2="58" stroke="#20302f" stroke-width="3"/>
  </g>

  <!-- land 3: theater (bottom-left) -->
  <g transform="translate(70,250)">
    <rect x="0" y="0" width="64" height="42" rx="4" fill="#e8633f" stroke="#20302f" stroke-width="3"/>
    <rect x="8" y="10" width="48" height="24" rx="3" fill="#fbf6ec" stroke="#20302f" stroke-width="2"/>
    <circle cx="32" cy="22" r="7" fill="#d99a2b"/>
  </g>

  <!-- land 4: tree (bottom-right) -->
  <g transform="translate(430,250)">
    <rect x="-5" y="20" width="10" height="26" fill="#9c5a2c" stroke="#20302f" stroke-width="2"/>
    <circle cx="0" cy="6" r="26" fill="#0f5e57" stroke="#20302f" stroke-width="3"/>
    <circle cx="-16" cy="14" r="14" fill="#0f5e57" stroke="#20302f" stroke-width="3"/>
    <circle cx="16" cy="14" r="14" fill="#0f5e57" stroke="#20302f" stroke-width="3"/>
  </g>

  <!-- compass -->
  <g transform="translate(40,40)">
    <circle r="16" fill="none" stroke="#d99a2b" stroke-width="2"/>
    <polygon points="0,-12 4,0 0,12 -4,0" fill="#e8633f"/>
    <text x="0" y="-18" font-family="Georgia, serif" font-size="9" fill="#0a3f3a" text-anchor="middle">N</text>
  </g>
</svg>
